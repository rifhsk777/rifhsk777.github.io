<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | RANK VS BOT</title>
<style>
:root {
  --bg: #080b12;
  --panel: rgba(18, 25, 40, .78);
  --border: rgba(255,255,255,.12);
  --text: #f5f7ff;
  --muted: #9ba8bf;
  --accent: #55e6a5;
  --danger: #ff6b81;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, rgba(33,95,106,.28), transparent 55%),
    linear-gradient(rgba(5,8,15,.83), rgba(5,8,15,.94)),
    url("logo.png") center / cover fixed,
    var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, sans-serif;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 16px 5%;
  border-bottom: 1px solid var(--border);
  background: rgba(8,11,18,.82);
  backdrop-filter: blur(16px);
}
.brand { font-weight: 900; letter-spacing: 1px; }
.brand span { color: var(--accent); }
.clock { color: var(--muted); font-size: 12px; }
main { width: min(1200px, 94%); margin: 28px auto; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  backdrop-filter: blur(15px);
  box-shadow: 0 15px 50px rgba(0,0,0,.22);
}
.login-wrap { max-width: 420px; margin: 9vh auto; }
h1 { font-size: 25px; margin: 0 0 7px; }
h2 { font-size: 18px; margin: 0 0 16px; }
.muted { color: var(--muted); }
label { display: block; margin: 15px 0 6px; color: var(--muted); }
input, select {
  width: 100%; padding: 12px 13px;
  color: var(--text); background: rgba(0,0,0,.25);
  border: 1px solid var(--border); border-radius: 10px;
  outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
button {
  padding: 11px 15px; border: 0; border-radius: 10px;
  background: var(--accent); color: #07130d; font-weight: 800;
}
button.secondary {
  background: rgba(255,255,255,.08);
  border: 1px solid var(--border); color: var(--text);
}
button.danger { background: var(--danger); color: #25060c; }
button:disabled { opacity: .5; cursor: wait; }
.full { width: 100%; margin-top: 17px; }
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 12px; margin-bottom: 18px;
}
.toolbar h1 { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.stats {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 12px; margin-bottom: 18px;
}
.stat strong { display: block; font-size: 25px; }
.stat span { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 950px; }
th, td {
  padding: 13px 11px; text-align: left;
  border-bottom: 1px solid var(--border); vertical-align: top;
}
th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
td { font-size: 13px; }
td select { min-width: 145px; }
.badge {
  display: inline-block; padding: 5px 8px; border-radius: 7px;
  background: rgba(85,230,165,.12); color: var(--accent);
  font-size: 11px; font-weight: 800;
}
.error { color: #ff9aa9; margin-top: 12px; white-space: pre-wrap; }
.success { color: var(--accent); margin-top: 12px; }
.empty { padding: 35px 10px; text-align: center; color: var(--muted); }
small { color: var(--muted); }
@media(max-width:600px) {
  header { padding: 13px 4%; }
  main { margin: 18px auto; }
  .card { padding: 16px; border-radius: 14px; }
  .stats { grid-template-columns: 1fr; }
  .toolbar { align-items: stretch; }
  .toolbar .actions { width: 100%; }
  .toolbar .actions button { flex: 1; }
}
</style>
</head>
<body>
<header>
  <div class="brand">RANK <span>VS BOT</span> / ADMIN</div>
  <div style="text-align:right">
    <div id="clock" class="clock">Memuat waktu...</div>
    <small>ADMIN DASHBOARD</small>
  </div>
</header>

<main>
  <section id="loginSection" class="login-wrap card">
    <h1>Admin Panel</h1>
    <p class="muted">Login untuk mengelola pesanan RANK VS BOT.</p>
    <form id="loginForm">
      <label for="password">Password admin</label>
      <input id="password" type="password" placeholder="Masukkan password" required autocomplete="current-password">
      <button class="full" id="loginButton" type="submit">LOGIN ADMIN</button>
    </form>
    <div id="loginMessage" class="error"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="toolbar">
      <div>
        <h1>Dashboard Pesanan</h1>
        <div class="muted">Kelola pesanan pelanggan.</div>
      </div>
      <div class="actions">
        <button class="secondary" id="refreshButton">↻ Refresh</button>
        <button class="danger" id="logoutButton">Logout</button>
      </div>
    </div>

    <div class="stats">
      <div class="card stat"><span>TOTAL PESANAN</span><strong id="totalOrders">0</strong></div>
      <div class="card stat"><span>MENUNGGU</span><strong id="waitingOrders">0</strong></div>
      <div class="card stat"><span>SELESAI</span><strong id="completedOrders">0</strong></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2>Daftar Pesanan</h2>
        <div style="min-width:190px">
          <input id="searchInput" type="search" placeholder="Cari nickname / ID / order...">
        </div>
      </div>
      <div id="dashboardMessage" class="error"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pesanan</th><th>Pelanggan</th><th>Layanan</th>
              <th>Jumlah</th><th>Jadwal</th><th>Total</th>
              <th>Status</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="emptyMessage" class="empty hidden">Belum ada pesanan.</div>
    </div>
  </section>
</main>

<script>
const API = "https://rifhskboy-github-io.rifhskstore.workers.dev";
const STATUSES = [
  "MENUNGGU",
  "SUDAH BAYAR",
  "DIPROSES",
  "SELESAI",
  "DIBATALKAN"
];

let token = sessionStorage.getItem("rvb_admin_token") || "";
let orders = [];

const $ = id => document.getElementById(id);

function rupiah(value) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency", currency: "IDR",
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

function showDashboard(show) {
  $("loginSection").classList.toggle("hidden", show);
  $("dashboard").classList.toggle("hidden", !show);
}

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers.Authorization = "Bearer " + token;

  const response = await fetch(API + path, { ...options, headers });
  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.success === false) {
    if (response.status === 401 && path !== "/api/admin/login") {
      logout();
    }
    throw new Error(data.detail || data.error || "Permintaan gagal (" + response.status + ").");
  }
  return data;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginMessage").textContent = "";
  $("loginButton").disabled = true;
  $("loginButton").textContent = "MEMERIKSA...";

  try {
    const data = await api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({ password: $("password").value })
    });
    token = data.token;
    if (!token) throw new Error("Token login tidak diterima dari server.");
    sessionStorage.setItem("rvb_admin_token", token);
    $("password").value = "";
    showDashboard(true);
    await loadOrders();
  } catch (error) {
    $("loginMessage").textContent = error.message;
  } finally {
    $("loginButton").disabled = false;
    $("loginButton").textContent = "LOGIN ADMIN";
  }
});

function logout() {
  token = "";
  orders = [];
  sessionStorage.removeItem("rvb_admin_token");
  showDashboard(false);
}

$("logoutButton").addEventListener("click", logout);
$("refreshButton").addEventListener("click", loadOrders);
$("searchInput").addEventListener("input", renderOrders);

async function loadOrders() {
  $("dashboardMessage").textContent = "Memuat pesanan...";
  $("refreshButton").disabled = true;

  try {
    const data = await api("/api/admin/orders");
    orders = Array.isArray(data) ? data : (data.orders || data.results || []);
    orders = orders.map(order => ({
      ...order,
      order_id: order.order_id ?? order.id ?? "",
      game_id: order.game_id ?? order.gameId ?? "",
      status: String(order.status || "MENUNGGU").toUpperCase()
    }));
    $("dashboardMessage").textContent = "";
    renderOrders();
  } catch (error) {
    $("dashboardMessage").textContent = error.message;
  } finally {
    $("refreshButton").disabled = false;
  }
}

function renderOrders() {
  const query = $("searchInput").value.trim().toLowerCase();
  const filtered = orders.filter(order =>
    [
      order.order_id, order.nickname, order.game_id,
      order.service, order.status
    ].some(value => String(value ?? "").toLowerCase().includes(query))
  );

  $("totalOrders").textContent = orders.length;
  $("waitingOrders").textContent = orders.filter(o =>
    ["MENUNGGU", "Menunggu"].includes(o.status)
  ).length;
  $("completedOrders").textContent = orders.filter(o =>
    o.status === "SELESAI"
  ).length;

  $("emptyMessage").classList.toggle("hidden", filtered.length !== 0);
  $("ordersBody").innerHTML = filtered.map(order => {
    const id = String(order.order_id || order.id || "");
    const options = STATUSES.map(status =>
      `<option value="${status}" ${order.status === status ? "selected" : ""}>${status}</option>`
    ).join("");

    return `<tr>
      <td><strong>${escapeHtml(id)}</strong><br><small>${escapeHtml(order.created_at || "")}</small></td>
      <td><strong>${escapeHtml(order.nickname)}</strong><br>ID: ${escapeHtml(order.game_id)}<br>
      <small>${escapeHtml(order.notes || "Tanpa catatan")}</small></td>
      <td><span class="badge">${escapeHtml(order.service)}</span></td>
      <td>${escapeHtml(order.quantity)} match</td>
      <td>${escapeHtml(order.schedule || "-")}</td>
      <td><strong>${rupiah(order.total)}</strong></td>
      <td><select data-status-id="${escapeHtml(id)}">${options}</select></td>
      <td><button data-save-id="${escapeHtml(id)}">Simpan</button></td>
    </tr>`;
  }).join("");
}

$("ordersBody").addEventListener("click", async event => {
  const button = event.target.closest("button[data-save-id]");
  if (!button) return;

  const id = button.dataset.saveId;
  const select = $("ordersBody").querySelector(`[data-status-id="${CSS.escape(id)}"]`);
  if (!select) return;

  button.disabled = true;
  button.textContent = "Menyimpan...";

  try {
    await api("/api/admin/orders/" + encodeURIComponent(id) + "/status", {
      method: "PATCH",
      body: JSON.stringify({ status: select.value })
    });
    $("dashboardMessage").className = "success";
    $("dashboardMessage").textContent = "Status pesanan berhasil diperbarui.";
    await loadOrders();
  } catch (error) {
    $("dashboardMessage").className = "error";
    $("dashboardMessage").textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Simpan";
  }
});

function updateClock() {
  $("clock").textContent = new Date().toLocaleString("id-ID", {
    timeZone: "Asia/Jakarta",
    dateStyle: "medium",
    timeStyle: "medium"
  });
}
updateClock();
setInterval(updateClock, 1000);

if (token) {
  showDashboard(true);
  loadOrders().catch(() => logout());
} else {
  showDashboard(false);
}
</script>
</body>
</html>
