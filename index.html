<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RANK VS BOT BY RIFHSK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div>
      <div id="clock">Memuat waktu...</div>
      <div id="date"></div>
    </div>
    <a class="channel-btn"
       href="https://whatsapp.com/channel/0029VbDxAA66hENnCu9hsB0l"
       target="_blank" rel="noopener">
      WhatsApp Channel
    </a>
  </header>

  <main class="container">
    <section class="hero card">
      <img src="logo.png" alt="Logo RIFHSK" class="logo">
      <h1>RANK VS BOT</h1>
      <p class="subtitle">BY RIFHSK</p>
      <p class="description">Layanan Rank Match Mobile Legends</p>
    </section>

    <section class="card">
      <h2>Pilih Layanan</h2>

      <div class="price-list">
        <button class="price-card active"
                type="button"
                data-service="FLEXIBLE"
                data-price="2500">
          <span>FLEXIBLE</span>
          <strong>Rp2.500</strong>
          <small>Per match</small>
        </button>

        <button class="price-card"
                type="button"
                data-service="NO FLEXIBLE"
                data-price="3500">
          <span>NO FLEXIBLE</span>
          <strong>Rp3.500</strong>
          <small>Per match</small>
        </button>
      </div>

      <form id="orderForm">
        <label for="nickname">Nickname Game</label>
        <input id="nickname" type="text"
               placeholder="Masukkan nickname"
               maxlength="40" required>

        <label for="gameId">ID Game</label>
        <input id="gameId" type="text"
               placeholder="Contoh: 123456789 (1234)"
               maxlength="30" required>

        <label for="quantity">Jumlah Match</label>
        <select id="quantity" required>
          <option value="1">1 Match</option>
          <option value="2">2 Match</option>
          <option value="3">3 Match</option>
          <option value="4">4 Match</option>
          <option value="5">5 Match</option>
        </select>

        <label for="notes">Catatan (opsional)</label>
        <textarea id="notes" rows="3"
                  maxlength="300"
                  placeholder="Tambahkan catatan pesanan"></textarea>

        <div class="total-box">
          <span>Total Pembayaran</span>
          <strong id="total">Rp2.500</strong>
        </div>

        <button type="submit" class="order-btn">
          Pesan Sekarang via WhatsApp
        </button>
      </form>
    </section>

    <section class="card payment">
      <h2>Pembayaran QRIS</h2>
      <p>Scan QRIS berikut untuk melakukan pembayaran.</p>
      <img src="qris.jpg" alt="QRIS Pembayaran" class="qris">

      <a href="qris.jpg" download="QRIS-RIFHSK.jpg"
         class="download-btn">
        Download QRIS
      </a>

      <p class="warning">
        Pastikan nominal pembayaran sesuai total pesanan.
      </p>
    </section>

    <footer>
      © <span id="year"></span> RANK VS BOT BY RIFHSK
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
