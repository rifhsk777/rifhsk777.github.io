<!-- Bagian Live Order -->
<section class="live-order-section">
  <h2>LIVE ORDER</h2>
  <div id="live-orders">
    Memuat pesanan...
  </div>
</section>

<!-- JavaScript harus berada di dalam tag script -->
<script>
const API_BASE = "https://rifhskboy-github-io.rifhskstore.workers.dev";

async function loadLiveOrders() {
  const container = document.getElementById("live-orders");
  if (!container) return;

  try {
    const response = await fetch(`${API_BASE}/api/orders/recent`);
    const data = await response.json();

    if (!response.ok || !data.success) {
      container.textContent = "Live Order belum tersedia.";
      return;
    }

    container.replaceChildren();

    if (!data.orders.length) {
      container.textContent = "Belum ada pesanan.";
      return;
    }

    data.orders.forEach(order => {
      const item = document.createElement("div");
      item.className = "live-order-item";

      const service = document.createElement("strong");
      service.textContent = order.service;

      const detail = document.createElement("p");
      detail.textContent =
        `${order.quantity} match · Rp${Number(order.total).toLocaleString("id-ID")}`;

      const status = document.createElement("small");
      status.textContent = order.status;

      item.append(service, detail, status);
      container.appendChild(item);
    });
  } catch (error) {
    container.textContent = "Gagal menghubungi server.";
    console.error(error);
  }
}

loadLiveOrders();
setInterval(loadLiveOrders, 15000);
</script>
</body>
</html>
